<style>

</style></head><body>
<div id="map"></div>
<div class="top"><div class="srch" style="position:relative"><img src="logo_header.svg" alt="맛있을지도?" style="height:44px;flex:none;margin:-6px 0">🔍<div class="sbox" style="flex:1;min-width:0"><input id="q" placeholder="식당·메뉴·지역 검색" autocomplete="off" style="width:100%"><div class="dd" id="dd"></div></div><a href="profile.html" title="내 프로필" style="flex:none;width:36px;height:36px;border-radius:50%;padding:2px;background:conic-gradient(#FFB800,#FF7A1A,#FFB800)"><span style="display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:url(img/p0_gukbap.jpg) center/cover"></span></a><button class="regb" id="regB" title="맛집 등록">＋ 등록</button></div><div class="ad" id="ad"></div><div class="chips" id="chips"></div></div>

<div class="modal" id="mReg"><div class="mbox"><h4>🍽️ 맛집 등록</h4><div class="sub">내가 직접 가 본 곳만 등록할 수 있어요. 위치는 지금 지도 가운데로 잡혀요.</div><input class="ti" id="rgN" placeholder="가게 이름"><select id="rgC"><option>한식</option><option>중식</option><option>일식</option><option>양식</option><option>분식</option><option>카페</option></select><div class="rs" id="rgM"></div><div class="btns"><div class="btn2" onclick="closeM()">취소</div><div class="btn" onclick="submitReg()">등록하기</div></div></div></div>

<script>
let map,clu,ovs=[],meOv;const FIL=['전체','한식','중식','일식','양식','분식','카페','가성비','혼밥','데이트','매운맛','내돈내산'];let fil='전체',me={...C0},cur=null;
function dist(a,b){const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fd=m=>m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km';
const vis=()=>P.filter(p=>fil=='전체'||p.c==fil||p.t.includes(fil)||(fil=='내돈내산'&&p.m)).map(p=>({...p,d:dist(me,p)})).sort((a,b)=>a.d-b.d);
const tag=p=>{const l=lvOf(p);return l==3?`<span class="tag g">🏅 ${LABEL.realPin}</span>`:l==2?'<span class="tag h">🔥 인기</span>':l==1?'<span class="tag">추천</span>':'<span class="tag">새 등록</span>'};
const bs=document.getElementById('bs'),inn=document.getElementById('in'),loc=document.getElementById('loc');
function setBs(cls){bs.className='bs '+(cls||'');loc.style.display=(cls&&innerWidth<760)?'none':'';loc.style.bottom=(cls=='open'?'calc(70% + 14px)':cls=='detail'?'min(574px,calc(85% + 14px))':'194px')}
const SORTS=[['near','📍 가까운 순'],['k',`👍 ${LABEL.overlap} 많은 순`],['new','🆕 최신 등록 순'],['vis','✅ 방문 인증 많은 순']];let srt=DB.get('sort','near');
function base(){if(!map)return {lat:me.lat,lng:me.lng,inb:()=>true};const c=map.getCenter(),b=map.getBounds();return {lat:c.getLat(),lng:c.getLng(),inb:p=>b.contain(new kakao.maps.LatLng(p.lat,p.lng))}}
function inView(){const B=base();let v=vis().filter(B.inb).map(p=>({...p,d:dist(B,p)}));const f={near:(a,b)=>a.d-b.d,k:(a,b)=>kOf(b)-kOf(a)||a.d-b.d,new:(a,b)=>b.at-a.at,vis:(a,b)=>vOf(b)-vOf(a)||a.d-b.d}[srt];return v.sort(f)}
const vOf=p=>p.v0+(DB.get('visits',[]).includes(p.id)?1:0);
function ago(t){const d=Math.floor((Date.now()-t)/864e5);return d<1?'오늘':d+'일 전'}
function setSort(k){srt=k;DB.set('sort',k);list()}
function list(){cur=null;const v=inView(),T=SORTS.find(s=>s[0]==srt)[1];const extra=p=>srt=='new'?' · '+ago(p.at)+' 등록':srt=='vis'?' · 방문 인증 '+vOf(p):'';inn.innerHTML=`<b style="font-size:16px">${map?'🗺️ 지금 지도 안':'📍 내 주변'} · ${T.replace(/^\S+ /,'')}</b> <span class="sub">${fil=='전체'?'':fil+' · '}${v.length}곳</span><div class="stabs">${SORTS.map(s=>`<button class="stab ${s[0]==srt?'on':''}" onclick="setSort('${s[0]}')">${s[1]}</button>`).join('')}</div>`+(v.length?v.map((p,i)=>`<div class="row" onclick="detail(${p.id})"><span class="rk ${lvOf(p)==3?'g':lvOf(p)==2?'h':''}">${i+1}</span><div class="th" style="background-image:url(img/${p.img}.jpg)"></div><div class="f"><b>${p.n}</b> ${p.m?'<span class="mm">내돈내산</span>':''}<div class="sub">${p.c} · ${fd(p.d)} · ${LABEL.overlap} ${kOf(p)}명${extra(p)}</div></div>${tag(p)}</div>`).join(''):'<p class="sub" style="padding:20px 0;text-align:center">지금 지도 화면 안에 맛집이 없어요.<br>지도를 옮기거나 축소해 보세요</p>')}
const gal=p=>[p.img,...IMG.filter(x=>x!=p.img).slice(0,3)];
function detail(id,noPan){const p=P[id];cur=id;setBs('detail');const g=gal(p),liked=likes().includes(id),visited=DB.get('visits',[]).includes(id);
 inn.innerHTML=`<div class="hero" onclick="lbOpen(${id},0)" style="background-image:url(img/${p.img}.jpg)"></div><div class="gal">${g.slice(1).map((x,i)=>`<div onclick="lbOpen(${id},${i+1})" style="background-image:url(img/${x}.jpg)"></div>`).join('')}<span class="sub" style="align-self:center;cursor:pointer" onclick="lbOpen(${id},0)">사진 ${kOf(p)*2+3}장 보기 ›</span></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">${p.n}</b>${tag(p)}</div><div class="sub" style="margin:4px 0 8px">${p.c} · ${p.menu.join(', ')} · ${fd(dist(me,p))} · ${LABEL.overlap} ${kOf(p)}명</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap">${p.m?'<span class="mm" style="padding:5px 8px">🧾 내돈내산 '+Math.ceil(p.k0/2)+'</span>':''}<span class="tag">📍 GPS 인증 ${Math.floor(p.k0/3)+(visited?1:0)}</span>${p.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
 <p class="sub" style="margin-top:10px">"또 오고 싶은 집이에요" — Lv.7 동네 미식가 외 ${Math.max(0,kOf(p)-1)}명</p>
 <div class="btns"><div class="btn ${liked?'liked':''}" id="likeBtn" onclick="like(${id})">${liked?'✅ 추천함':'👍 나도 추천'} · ${kOf(p)}</div><div class="btn2" onclick="visit(${id})">${visited?'✅ 방문함':'📍 방문 인증'}</div></div>
 <div class="btns" style="margin-top:8px"><div class="btn2" style="flex:1;text-align:center" onclick="openRep(${id})">🚨 신고</div><div class="btn2" style="flex:1;text-align:center" onclick="openEdit(${id})">✏️ 수정 제안</div></div><p class="sub" style="margin-top:12px;cursor:pointer" onclick="setBs('open');list()">← 목록으로</p>`;
 if(map&&!noPan){map.setCenter(new kakao.maps.LatLng(p.lat,p.lng));setTimeout(()=>map.panBy(0,Math.round(bs.offsetHeight/2)-80),350)}}
function like(id){const l=likes();if(l.includes(id)){toast('이미 추천한 맛집이에요 (1인 1회)');return}l.push(id);DB.set('likes',l);toast('추천했어요! +10 XP');detail(id,1);draw()}
function visit(id){const v=DB.get('visits',[]);if(v.includes(id)){toast('이미 방문 인증한 곳이에요');return}
 const p=P[id],d=dist(me,p);if(d>300){toast(`식당과 ${fd(d)} 떨어져 있어요. 반경 300m 안에서 인증할 수 있어요 (프로토타입이라 인증 처리)`)}else toast('📍 방문 인증 완료! 스티커를 받았어요');
 v.push(id);DB.set('visits',v);const m=MISSIONS[0];if(m.calc()>=m.goal&&!DB.get('m_top10_done'))setTimeout(()=>{toast('🎉 미션 달성: '+m.t);DB.set('m_top10_done',1)},2300);detail(id,1)}
const REASONS=['잘못된 위치','폐업 또는 영업 종료','허위 정보','부적절한 콘텐츠','광고·홍보성 등록'];let mid=null;
function openRep(id){mid=id;const done=DB.get('reports',{})[id]||[];document.getElementById('repName').textContent=P[id].n+' · 같은 사유로는 한 번만 신고할 수 있어요';
 document.getElementById('repR').innerHTML=REASONS.map(r=>`<label class="${done.includes(r)?'dis':''}"><input type="radio" name="rr" value="${r}" ${done.includes(r)?'disabled':''}><span>${r}${done.includes(r)?' (신고함)':''}</span></label>`).join('');document.getElementById('mRep').classList.add('on')}
function submitRep(){const c=document.querySelector('#repR input:checked');if(!c){toast('신고 사유를 선택해 주세요');return}const R=DB.get('reports',{});(R[mid]=R[mid]||[]).push(c.value);DB.set('reports',R);closeM();toast('신고가 접수됐어요. 검토 후 처리돼요')}
function openEdit(id){mid=id;document.getElementById('edName').textContent=P[id].n;document.getElementById('edT').value='';document.getElementById('mEdit').classList.add('on')}
function submitEdit(){const t=document.getElementById('edT').value.trim();if(t.length<2){toast('수정할 내용을 적어 주세요');return}const E=DB.get('edits',[]);E.push({id:mid,f:document.getElementById('edF').value,t,at:Date.now()});DB.set('edits',E);closeM();toast('수정 제안을 보냈어요. 고마워요!')}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target==m)closeM()});

function search(){const v=q.value.trim();if(!v){dd.classList.remove('on');return}const L=v.toLowerCase();
 const rs=P.filter(p=>p.n.includes(v)||p.c.includes(v)).slice(0,5);const ms=P.filter(p=>!rs.includes(p)&&p.menu.some(m=>m.includes(v))).slice(0,5);

 if(o.t=='g'){q.value=o.g.name;if(map&&o.g.lat){map.setLevel(4);map.panTo(new kakao.maps.LatLng(o.g.lat,o.g.lng))}else toast('지역 이동은 지도 로드 후 가능해요');setBs('');list()}
 else{q.value=o.p.n;if(map&&map.getLevel()>=6)map.setLevel(4);detail(o.p.id)}}

function draw(){if(!map)return;clu.clear();ovs.forEach(o=>o.setMap(null));ovs=[];const v=vis(),mk=[];
 v.forEach(p=>{const el=document.createElement('div');const l=lvOf(p);el.className='pin lv'+l;el.innerHTML=`${p.m&&l>0?'<span class="md">내돈내산</span>':''}<div class="b"><span>${l>0?kOf(p):''}</span></div><div class="n">${p.n}</div>`;el.onclick=()=>detail(p.id);

function initMap(){kakao.maps.load(()=>{map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(C0.lat,C0.lng),level:5});

let locN=0,watchId=null,accC=null,gotFix=false,lastAcc=null;
const LV_IN=3,LV_OUT=4;
function geoErr(e){loc.classList.remove('wait');
 if(!window.isSecureContext){toast('https 주소에서만 위치를 쓸 수 있어요. https://로 접속해 주세요');return}
 toast(e.code==1?'위치 권한이 꺼져 있어요. 주소창 왼쪽 자물쇠 → 위치 → 허용으로 바꾼 뒤 다시 눌러 주세요 (휴대폰은 설정 → 위치 서비스도 켜 주세요)':e.code==2?'위치 신호를 못 잡았어요. 휴대폰 GPS(위치)를 켜고 실외나 창가에서 다시 시도해 주세요':e.code==3?'위치 확인이 오래 걸려요. GPS를 켰는지 확인하고 다시 눌러 주세요':'현재 위치를 가져오지 못했어요')}
function onPos(pos,first){const c=pos.coords;if(gotFix&&lastAcc!=null&&c.accuracy>lastAcc*1.5&&c.accuracy>50)return; // 더 부정확한 값은 무시
 lastAcc=c.accuracy;me={lat:c.latitude,lng:c.longitude};window.__acc=c.accuracy;loc.classList.remove('wait');loc.classList.add('on');
 if(map){const ll=new kakao.maps.LatLng(me.lat,me.lng);meOv.setPosition(ll);meOv.setMap(map.getLevel()>=6?null:map);
  if(!accC)accC=new kakao.maps.Circle({map,center:ll,radius:c.accuracy,strokeWeight:1,strokeColor:'#3b82f6',strokeOpacity:.6,fillColor:'#3b82f6',fillOpacity:.12});else{accC.setPosition(ll);accC.setRadius(c.accuracy)}
  if(!gotFix){gotFix=true;map.panTo(ll);toast(c.accuracy>200?`대략적인 위치예요 (오차 약 ${Math.round(c.accuracy)}m). GPS를 켜면 더 정확해져요`:`내 위치로 이동했어요 (오차 약 ${Math.round(c.accuracy)}m)`)}}
 else gotFix=true;
 if(cur==null&&!map)list()}
function startWatch(){if(watchId!=null)return;watchId=navigator.geolocation.watchPosition(p=>onPos(p),e=>{if(!gotFix)geoErr(e)},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 setTimeout(()=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}},120000)} // 2분간 보정 후 배터리 절약
function zoomTo(lv){if(!map)return;const ll=new kakao.maps.LatLng(me.lat,me.lng);map.setLevel(lv,{anchor:ll,animate:{duration:350}});setTimeout(()=>map.panTo(ll),380)}
loc.onclick=async()=>{if(!navigator.geolocation){toast('이 브라우저는 위치 기능을 지원하지 않아요');return}
 if(!window.isSecureContext){toast('https 주소에서만 위치를 쓸 수 있어요');return}
 try{const ps=await navigator.permissions?.query({name:'geolocation'});if(ps&&ps.state=='denied'){geoErr({code:1});return}}catch(e){}
 locN++;window.__locClicks=locN;
 if(locN==1||!gotFix){locN=1;gotFix=false;lastAcc=null;loc.classList.add('wait');
  navigator.geolocation.getCurrentPosition(p=>onPos(p,1),e=>{ // 고정밀 실패 시 저정밀로 한 번 더
   if(e.code==1)return geoErr(e);navigator.geolocation.getCurrentPosition(p=>onPos(p,1),geoErr,{enableHighAccuracy:false,timeout:10000,maximumAge:300000})},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  startWatch();return}
 const ll=new kakao.maps.LatLng(me.lat,me.lng);
