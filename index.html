const tag=p=>{const l=lvOf(p);return l==4?'<span class="tag lg">👑 레전드</span>':l==3?`<span class="tag r">🏅 ${LABEL.realPin}</span>`:l==2?'<span class="tag h">🔥 인기</span>':l==1?'<span class="tag">추천</span>':'<span class="tag">새 등록</span>'};
const bs=document.getElementById('bs'),inn=document.getElementById('in'),loc=document.getElementById('loc');
function setBs(cls){bs.className='bs '+(cls||'');const lg=document.getElementById('lgd');if(lg)lg.style.display=(cls&&innerWidth<760)?'none':''}

function base(){if(!map)return {lat:me.lat,lng:me.lng,inb:()=>true};const c=map.getCenter(),b=map.getBounds();return {lat:c.getLat(),lng:c.getLng(),inb:p=>b.contain(new kakao.maps.LatLng(p.lat,p.lng))}}
let meKnown=false,ltab='near';function inView(){const B=base(),O=meKnown?me:B;let v=vis().filter(B.inb).map(p=>({...p,d:dist(O,p)}));const f={near:(a,b)=>a.d-b.d,k:(a,b)=>kOf(b)-kOf(a)||a.d-b.d,new:(a,b)=>b.at-a.at,vis:(a,b)=>vOf(b)-vOf(a)||a.d-b.d}[srt];return v.sort(f)}

function list(){cur=null;const v=inView(),T=SORTS.find(s=>s[0]==srt)[1];const extra=p=>srt=='new'?' · '+ago(p.at)+' 등록':srt=='vis'?' · 방문 인증 '+vOf(p):'';if(FEATURE.favorites&&ltab=='fav')return favList();inn.innerHTML=`${ftabs()}<b style="font-size:16px">${T}</b> <span class="sub">${fil=='전체'?'':fil+' · '}${v.length}곳</span>${srt=='near'&&!meKnown?'<div class="sub" style="font-size:11px;margin-top:2px">ⓘ 내 위치를 몰라 지도 가운데 기준 거리예요 · ◎ 버튼을 눌러 주세요</div>':''}<div class="stabs">${SORTS.map(s=>`<button class="stab ${s[0]==srt?'on':''}" onclick="setSort('${s[0]}')">${s[1]}</button>`).join('')}</div>`+(v.length?v.map((p,i)=>`<div class="row" onclick="detail(${p.id})"><span class="rk ${lvOf(p)==3?'g':lvOf(p)==2?'h':''}">${i+1}</span><div class="th" style="background-image:url(${iu(p.img)})"></div><div class="f"><b>${p.n}</b> ${p.m?'<span class="mm">내돈내산</span>':''}<div class="sub">${p.c} · ${fd(p.d)} · ${LABEL.overlap} ${kOf(p)}명${extra(p)}</div></div>${tag(p)}</div>`).join(''):'<p class="sub" style="padding:20px 0;text-align:center">지금 지도 화면 안에 맛집이 없어요.<br>지도를 옮기거나 축소해 보세요</p>')}

 if(map&&!noPan)focusOn(p)}

function clusterDraw(v){const pr=map.getProjection(),R=95,C=[];
 [...v].sort((a,b)=>kOf(b)-kOf(a)).forEach(p=>{const pt=pr.containerPointFromCoords(new kakao.maps.LatLng(p.lat,p.lng));let c=C.find(c=>Math.hypot(c.x-pt.x,c.y-pt.y)<R);if(!c)C.push(c={x:pt.x,y:pt.y,L:[]});c.L.push(p)});
 // 겹치는 묶음끼리 한 번 더 합치기
 for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++)if(Math.hypot(C[i].x-C[j].x,C[i].y-C[j].y)<R*1.1){C[i].L.push(...C[j].L);C.splice(j--,1)}
 C.map(c=>c.L).forEach(L=>{const n=L.length,lat=L.reduce((a,p)=>a+p.lat,0)/n,lng=L.reduce((a,p)=>a+p.lng,0)/n,top=[...L].sort((a,b)=>kOf(b)-kOf(a))[0],el=document.createElement('div');
  if(CLUSTER_STYLE=='photo'){const sz=n>=20?80:n>=5?64:48;el.className='cp';el.innerHTML=`<div class="im" style="width:${sz}px;height:${sz}px;background-image:url(${iu(top.img)})"></div><span class="bd">${n}</span><span class="nm">대표 ${top.n}</span>`}
  else{const sz=n>=20?92:n>=5?74:56;el.className='ce';el.innerHTML=`<svg width="${sz}" height="${sz}" viewBox="-50 -50 100 100"><path d="M-40 -8 C-44 -34 -14 -46 8 -42 C32 -38 46 -20 42 4 C40 26 22 44 -4 42 C-30 40 -38 18 -40 -8Z" fill="#fff" stroke="#FFB800" stroke-width="3"/><circle r="${n>=20?27:24}" fill="#FFB800"/><circle cx="-9" cy="-10" r="6" fill="#FFE27A"/><text y="${n>=20?5:4}" text-anchor="middle" font-size="${n>=20?22:20}" font-weight="900" fill="#5a3b00" font-family="Pretendard,sans-serif">${n}</text><text y="${n>=20?19:17}" text-anchor="middle" font-size="9" font-weight="700" fill="#5a3b00" font-family="Pretendard,sans-serif">맛집</text></svg>`}
  const ll=new kakao.maps.LatLng(lat,lng);el.onclick=()=>{map.setLevel(Math.max(4,map.getLevel()-3),{anchor:ll,animate:{duration:300}})};cls.push(new kakao.maps.CustomOverlay({map,position:ll,content:el,zIndex:30}))})}

const AD_EASE='transform 560ms cubic-bezier(0.22, 1, 0.36, 1)';
function adSlider(box,closable){const n=ADS.length;let pos=1,idx=0,busy=false,drag=null,paused=false;
 const sl=(a,clone)=>`<div class="sl" ${clone?'aria-hidden="true"':''} style="background:linear-gradient(90deg,${a[3]}ee 0%,${a[3]}aa 45%,rgba(0,0,0,0) 80%),url(img/${a[0]}.jpg) center/cover"><div class="tx"><b>${a[1]}</b><small>${a[2]}</small></div></div>`;

 t.addEventListener('transitionend',e=>{if(e.target!==t)return;busy=false;if(pos==0){pos=n;mv(false)}else if(pos==n+1){pos=1;mv(false)}});
 const go=st=>{if(!st){mv(true);return}if(busy){pos=((pos-1+n)%n)+1;mv(false)}busy=true;pos+=st;idx=((idx+st)%n+n)%n;mv(true);dots()};
 box.querySelectorAll('.dots i').forEach(d=>{d.onpointerdown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();go(+d.dataset.i-idx)}});
